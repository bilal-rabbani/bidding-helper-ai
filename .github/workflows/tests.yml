name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Secret check
        run: python scripts/check_no_secrets.py

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -v --junitxml=report.xml | tee pytest.txt

      - name: Show results on the run page
        if: always()
        shell: bash
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 pytest.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
